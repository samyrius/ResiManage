name: ResiManage Android test APK
# Test build requested for the current ResiManage 2 source on resimanage-2-work.

# Paused by user request until all ResiManage 2 directives are implemented.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK for phone testing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ResiManage 2
        uses: actions/checkout@v4
        with:
          ref: resimanage-2-work

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Show build environment
        run: |
          java -version
          gradle --version
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f app.py
          test -f requirements.txt

      - name: Build Android debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        id: verify
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release-test
          cp "$APK" release-test/ResiManage-2-photo-fix-test.apk
          sha256sum release-test/ResiManage-2-photo-fix-test.apk | tee release-test/SHA256SUMS.txt
          ls -lh release-test/

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ResiManage-2-photo-fix-test-apk
          path: release-test/*
          if-no-files-found: error
          retention-days: 14
