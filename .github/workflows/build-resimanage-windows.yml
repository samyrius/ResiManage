name: ResiManage Windows test EXE

on:
  push:
    branches:
      - "resimanage-2-work"
    paths:
      - ".github/workflows/build-resimanage-windows.yml"
      - "app.py"
      - "requirements.txt"
      - "windows_launcher.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ResiManage 2
        uses: actions/checkout@v4
        with:
          ref: resimanage-2-work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Package standalone Windows executable
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name ResiManage --collect-all flask --collect-all werkzeug --collect-all openpyxl --collect-all xlrd --collect-all docx --collect-all pypdf --collect-all PIL windows_launcher.py

      - name: Verify executable and prepare test bundle
        shell: pwsh
        run: |
          $exe = "dist/ResiManage.exe"
          if (!(Test-Path $exe) -or (Get-Item $exe).Length -eq 0) { throw "EXE build output is missing or empty." }
          New-Item -ItemType Directory -Force -Path release-test | Out-Null
          Copy-Item $exe "release-test/ResiManage-2-Windows-test.exe"
          @"
          ResiManage 2 — Windows test build
          1. Extract this artifact ZIP to a folder you control.
          2. Double-click ResiManage-2-Windows-test.exe.
          3. Keep the black console window open; the app opens in your browser at http://127.0.0.1:5000.
          4. The local database and secret are stored beside the EXE. Back up that folder before testing with real resident records.
          5. Press Ctrl+C in the console to stop the app.
          "@ | Set-Content "release-test/LISEZ-MOI.txt" -Encoding UTF8
          Get-FileHash "release-test/ResiManage-2-Windows-test.exe" -Algorithm SHA256 | Format-List | Out-String | Set-Content "release-test/SHA256.txt"

      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: ResiManage-2-Windows-test-exe
          path: release-test/*
          if-no-files-found: error
          retention-days: 14
