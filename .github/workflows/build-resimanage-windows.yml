name: ResiManage Windows EXE and installer

on:
  push:
    branches:
      - "resimanage-2-work"
    paths:
      - ".github/workflows/build-resimanage-windows.yml"
      - "app.py"
      - "requirements.txt"
      - "windows_launcher.py"
      - "windows/ResiManage-Setup.iss"
      - "static/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout ResiManage 2
        uses: actions/checkout@v4
        with:
          ref: resimanage-2-work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install pyinstaller pywebview

      - name: Run Python regression tests on Windows
        env:
          ROTATION_SECRET: windows-ci-test-secret
        run: pytest -q

      - name: Build GUI executable (no console)
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole --name ResiManage --collect-all webview --collect-all flask --collect-all werkzeug --collect-all openpyxl --collect-all xlrd --collect-all docx --collect-all pypdf --collect-all PIL --add-data "static;static" windows_launcher.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { throw "Inno Setup compiler was not found." }

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows/ResiManage-Setup.iss"
          if (!(Test-Path "release-installer/ResiManage-2-Setup.exe")) { throw "Setup.exe was not created." }

      - name: Prepare release bundle and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-test | Out-Null
          Copy-Item "dist/ResiManage.exe" "release-test/ResiManage-2-Portable.exe"
          Copy-Item "release-installer/ResiManage-2-Setup.exe" "release-test/ResiManage-2-Setup.exe"
          @"
          ResiManage 2 — Windows test
          - Pour une installation classique : lancez ResiManage-2-Setup.exe. L'assistant installe l'application dans votre profil Windows et peut créer un raccourci Bureau.
          - Pour la version portable : lancez ResiManage-2-Portable.exe.
          - L'application ouvre sa propre fenêtre. Elle utilise un serveur Flask local en arrière-plan; aucune adresse n'est à saisir.
          - Microsoft Edge WebView2 Runtime est requis pour afficher la fenêtre intégrée.
          - La base locale et le secret sont créés à côté de l'application installée. Faites une sauvegarde du dossier avant tout essai avec des dossiers réels.
          "@ | Set-Content "release-test/LISEZ-MOI.txt" -Encoding UTF8
          Get-FileHash "release-test/ResiManage-2-Setup.exe","release-test/ResiManage-2-Portable.exe" -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content "release-test/SHA256.txt"

      - name: Upload Windows setup and portable app
        uses: actions/upload-artifact@v4
        with:
          name: ResiManage-2-Windows-Setup-and-Portable
          path: release-test/*
          if-no-files-found: error
          retention-days: 14
