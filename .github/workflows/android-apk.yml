name: Android APK + emulator smoke tests

# Paused by user request until all ResiManage 2 directives are implemented.
# Run manually only after the full implementation phase is complete.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run Python regression tests
        env:
          ROTATION_SECRET: ci-test-secret
        run: pytest -q

  build-debug-apk:
    needs: python-regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
          accept-android-sdk-licenses: true
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: resimanage2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke-test:
    needs: build-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 emulator"
          accept-android-sdk-licenses: true
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: resimanage2-debug-apk
          path: apk
      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set -euo pipefail
            mkdir -p emulator-evidence
            adb install apk/app-debug.apk
            adb shell monkey -p com.samyrius.rotationapp 1
            sleep 25
            adb shell dumpsys activity activities > emulator-evidence/activities.txt
            adb logcat -d > emulator-evidence/emulator-logcat.txt
            adb shell screencap -p /sdcard/resimanage.png
            adb pull /sdcard/resimanage.png emulator-evidence/screenshot.png
            grep -q "com.samyrius.rotationapp" emulator-evidence/activities.txt
            if grep -E "FATAL EXCEPTION|Process: com.samyrius.rotationapp" emulator-evidence/emulator-logcat.txt; then
              exit 1
            fi
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resimanage2-emulator-evidence
          path: emulator-evidence/
          if-no-files-found: warn
          retention-days: 14
