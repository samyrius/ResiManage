name: Browser quality checks

on:
  push:
    branches: ["integration/**"]
  pull_request:
    branches: ["resimanage-2-work"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROTATION_SECRET: ci-browser-test-secret
      PORT: "5000"
      RESIMANAGE_BASE_URL: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start disposable ResiManage instance
        run: |
          nohup python app.py > /tmp/resimanage-playwright.log 2>&1 &
          for attempt in $(seq 1 60); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=2)"; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/resimanage-playwright.log
          exit 1
      - name: Run browser smoke tests
        run: pytest -q tests/e2e/browser_smoke.py
