name: Python checks

on:
  push:
    branches: [main, security/harden-authentication]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q app.py tests
      - name: Run Ruff critical-error checks
        run: python -m ruff check --select E9,F63,F7,F82 app.py tests
      - name: Run regression tests with temporary databases
        run: python -m pytest -q
      - name: Smoke-test login page
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import app
          with tempfile.TemporaryDirectory() as tmp:
              app.DB = str(Path(tmp) / 'ci-rotation.db')
              app.app.config.update(TESTING=True, SECRET_KEY='ci-only-secret')
              app.init()
              client = app.app.test_client()
              response = client.get('/login')
              assert response.status_code == 200, response.status_code
              assert b'name="password"' in response.data, 'Password input missing'
              print('Login page smoke test passed')
          PY
