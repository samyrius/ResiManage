plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.samyrius.rotationapp"
    compileSdk 35

    defaultConfig {
        applicationId "com.samyrius.rotationapp"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "2.0.0"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        pip {
            install("-r", "../../requirements.txt")
        }
    }
}

def copyRotationPythonApp = tasks.register("copyRotationPythonApp", Copy) {
    from(rootProject.file("../app.py"))
    into(layout.projectDirectory.dir("src/main/python"))
}
def copyRotationStaticAssets = tasks.register("copyRotationStaticAssets", Copy) {
    from(rootProject.file("../static"))
    into(layout.projectDirectory.dir("src/main/python/static"))
}
def copyRotationLauncherIcon = tasks.register("copyRotationLauncherIcon", Copy) {
    from(rootProject.file("../static/resimanage-3d-icon.jpg"))
    into(layout.projectDirectory.dir("src/main/res/drawable"))
    rename { "resimanage_3d_launcher.jpg" }
}
def copyRotationLauncherIconMipmap = tasks.register("copyRotationLauncherIconMipmap", Copy) {
    from(rootProject.file("../static/resimanage-3d-icon.jpg"))
    into(layout.projectDirectory.dir("src/main/res/mipmap-nodpi"))
    rename { "ic_launcher.jpg" }
}
def copyRotationLauncherIconPng = tasks.register("copyRotationLauncherIconPng", Copy) {
    from(rootProject.file("../static/resimanage-3d-icon.png"))
    into(layout.projectDirectory.dir("src/main/res/drawable-nodpi"))
    rename { "resimanage_3d_launcher_png.png" }
}
def copyRotationLauncherIconMipmapPng = tasks.register("copyRotationLauncherIconMipmapPng", Copy) {
    from(rootProject.file("../static/resimanage-3d-icon.png"))
    into(layout.projectDirectory.dir("src/main/res/mipmap-nodpi"))
    rename { "ic_launcher.png" }
}
tasks.named("preBuild").configure {
    dependsOn(copyRotationPythonApp, copyRotationStaticAssets, copyRotationLauncherIcon, copyRotationLauncherIconMipmap, copyRotationLauncherIconPng, copyRotationLauncherIconMipmapPng)
}
tasks.configureEach {
    if (name.toLowerCase().contains("python") && name != "copyRotationPythonApp" && name != "copyRotationStaticAssets") {
        dependsOn(copyRotationPythonApp, copyRotationStaticAssets)
    }
}
