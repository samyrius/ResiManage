plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.samyrius.rotationapp"
    compileSdk 35

    defaultConfig {
        applicationId "com.samyrius.rotationapp"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        pip {
            install("-r", "../../requirements.txt")
        }
    }
}

def copyRotationPythonApp = tasks.register("copyRotationPythonApp", Copy) {
    from(rootProject.file("../app.py"))
    into(layout.projectDirectory.dir("src/main/python"))
}
tasks.named("preBuild").configure {
    dependsOn(copyRotationPythonApp)
}
tasks.configureEach {
    if (name.toLowerCase().contains("python") && name != "copyRotationPythonApp") {
        dependsOn(copyRotationPythonApp)
    }
}
