language: "fr-FR"
 reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  path_instructions:
    - path: "app.py"
      instructions: "Prioritize Flask authorization, server-side validation, SQLite transaction safety, resident-data privacy, and backward compatibility. Never assume a resident, service, or rotation rule not supported by the code or project documentation."
    - path: "guards.py"
      instructions: "Check guard-roster eligibility, duplicate prevention, audit history, date boundaries, and atomic persistence. Do not invent automatic guard rotation rules."
    - path: "tests/**"
      instructions: "Prefer regression tests for business rules, permissions, transaction rollback, and mobile/browser interaction edge cases."
  tools:
    github-checks:
      enabled: true
